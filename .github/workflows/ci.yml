name: CI

on:
  push:
    branches: [main, master, working-MVP]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: fmg.config.settings_test
  DEBUG: "True"
  SECRET_KEY: ci-secret-key-not-for-production
  ALLOWED_HOSTS: "*"
  POSTGRES_DB: fmg_test
  POSTGRES_USER: fmg_test
  POSTGRES_PASSWORD: fmg_test
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  CELERY_BROKER_URL: redis://localhost:6379/1
  CELERY_RESULT_BACKEND: redis://localhost:6379/1

jobs:

  # ---------- 1. Lint ----------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # ---------- 2. Typecheck ----------
  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy .

  # ---------- 3. Unit test ----------
  test-unit:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -v

  # ---------- 4. Smoke + Integration (real services) ----------
  test-smoke-integration:
    runs-on: ubuntu-latest
    needs: test-unit
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fmg_test
          POSTGRES_USER: fmg_test
          POSTGRES_PASSWORD: fmg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Run migrations
        run: uv run python manage.py migrate
      - name: Run smoke tests
        run: uv run pytest tests/smoke -v
      - name: Run integration tests
        run: uv run pytest tests/integration -v

  # ---------- 5. Syntax validation of compose files ----------
  validate-compose:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Create dummy .env for compose validation
        run: |
          cat <<EOF > .env
          DEBUG=True
          SECRET_KEY=dummy
          ALLOWED_HOSTS=*
          POSTGRES_DB=dummy
          POSTGRES_USER=dummy
          POSTGRES_PASSWORD=dummy
          POSTGRES_HOST=dummy
          POSTGRES_PORT=5432
          CELERY_BROKER_URL=redis://dummy:6379/0
          EOF
      - name: Validate compose files syntax
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q

  # ---------- 6. Build Dockerfile (syntax validation, not push) ----------
  build:
    runs-on: ubuntu-latest
    needs: [test-smoke-integration, validate-compose]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t fmg:ci-test .
