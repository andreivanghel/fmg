<div class="border border-neutral-800 rounded-xl bg-neutral-900 p-6">
  <div class="flex items-center justify-between mb-4">
    <span class="text-xs text-neutral-500">Result — #{{ run.run_id }}</span>
    <span class="text-xs font-mono px-1.5 py-0.5 rounded border
      {% if run.status == 'completed' %}bg-emerald-950 text-emerald-400 border-emerald-900{% else %}bg-red-950 text-red-400 border-red-900{% endif %}">
      {{ run.status }}
    </span>
  </div>

  {% if run.outputs %}
    <div class="space-y-2 text-sm">
      {% for key, value in run.outputs.items %}
        <div class="flex justify-between border-b border-neutral-800 pb-2">
          <span class="text-neutral-500">{{ key }}</span>
          <span class="font-mono text-neutral-300">{{ value }}</span>
        </div>
      {% endfor %}
    </div>
  {% elif run.error_message %}
    <div class="text-sm text-red-400">{{ run.error_message }}</div>
  {% else %}
    <div class="text-sm text-neutral-500">No output for this run.</div>
  {% endif %}
</div>
