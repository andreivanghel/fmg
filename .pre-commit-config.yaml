repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files # Blocca file giganti
        args: ['--maxkb=5000']
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master] # Non pushare direttamente su main

  # Blocca i file .env per non sputtanare le tue password su GitHub
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key

  # RUFF: Fa sia da Linter che da Formatter velocissimo
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff # Linting
        args: [ --fix ]
      - id: ruff-format # Formatting

  # MYPY: Controlla che i tipi di dati siano corretti (Typechecking)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests] # Aggiungi tipi se usi librerie esterne
