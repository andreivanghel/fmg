name: CD

# The job checks if the CI was passed on main before deploying
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    # Ambiente GitHub dedicato: i secret sotto NON sono repo-wide, esistono
    # solo per i job che dichiarano "environment: production". Da Settings
    # -> Environments puoi anche richiedere un'approvazione manuale prima
    # che questo job parta, se un domani lavori in team.
    environment: production
    steps:
      - name: Deploy to VM over SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" '
            set -e
            cd ~/fmg &&
            git pull origin main &&
            docker compose -f docker-compose.prod.yml build &&
            docker compose -f docker-compose.prod.yml up -d &&
            docker image prune -f
          '
